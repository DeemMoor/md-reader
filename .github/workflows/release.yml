name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: wix,nsis
          - os: macos-latest
            formats: app
          - os: ubuntu-22.04
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - run: cargo test --release
      - name: Package
        shell: bash
        run: |
          set -o pipefail
          if ! cargo packager --release --formats ${{ matrix.formats }} 2>&1 | tee packager.log; then
            # Job logs need a token to read; annotations are public.
            tail -n 40 packager.log | sed 's/^/::error::/'
            exit 1
          fi
      # cargo-packager's DMG step drives Finder via AppleScript, which is unreliable on
      # headless runners; hdiutil builds the same image without a GUI session.
      - name: Build DMG
        if: runner.os == 'macOS'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app=$(find target/dist -maxdepth 1 -name '*.app' | head -n1)
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "MD Reader" -srcfolder "$staging" -ov -format UDZO \
            "target/dist/mdreader_${version}_$(uname -m).dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/dist/*.msi
            target/dist/*-setup.exe
            target/dist/*.dmg
            target/dist/*.deb
            target/dist/*.AppImage

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
