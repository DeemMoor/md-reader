name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: wix,nsis
          - os: macos-latest
            formats: app
          - os: ubuntu-22.04
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - run: cargo test --release
      - name: Package
        shell: bash
        run: |
          set -o pipefail
          if ! cargo packager --release --formats ${{ matrix.formats }} 2>&1 | tee packager.log; then
            # Job logs need a token to read; annotations are public.
            # One annotation (GitHub keeps only the first 10), newlines encoded as %0A.
            echo "::error::$(tail -n 25 packager.log | sed 's/\x1b\[[0-9;]*m//g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      # cargo-packager's DMG step drives Finder via AppleScript, which is unreliable on
      # headless runners; hdiutil builds the same image without a GUI session.
      - name: Build DMG
        if: runner.os == 'macOS'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app=$(find target/dist -maxdepth 1 -name '*.app' | head -n1)
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "MD Reader" -srcfolder "$staging" -ov -format UDZO \
            "target/dist/mdreader_${version}_$(uname -m).dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/dist/*.msi
            target/dist/*-setup.exe
            target/dist/*.dmg
            target/dist/*.deb
            target/dist/*.AppImage

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The release description (and the in-app "what is new") is this version's CHANGELOG.md section.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$crate" = "$version" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1; }
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          grep -q "[^[:space:]]" notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
