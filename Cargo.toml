[package]
name = "mdreader"
version = "0.1.0"
edition = "2024"

[dependencies]
open = "5.4.4"
pulldown-cmark = "0.13.4"
rfd = "0.17.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tao = "0.37.1"
wry = "0.57.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
